[project]
name = "agent-standards-checks"
version = "0.7.0"
description = "Shared CI checks for the owner's repositories: project.yml, PR title, size and literal ratchets, suppressions, pinned actions, release tags."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "tree-sitter>=0.26.1",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "standards"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C90", "PL", "RUF"]

[tool.ruff.lint.pylint]
# The default ignores strings; code.md asks for named constants for them too.
allow-magic-value-types = []

[tool.ruff.lint.per-file-ignores]
# Test data is exempt from the literal rule (code.md, Names over literals).
"tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
mypy_path = ["src", "tests"]
packages = ["standards"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
