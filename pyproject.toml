[project]
name = "agent-standards-checks"
version = "0.9.0"
description = "Shared CI checks for the owner's repositories, and the command that writes the shared rules into them."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "tree-sitter>=0.26.1",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]

[project.scripts]
standards = "standards.run:main"
standards-sync = "standards.sync:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/standards"]

# The shared files travel inside the package, at their repository paths
# under standards/files/, so `standards-sync` writes this exact version.
[tool.hatch.build.targets.wheel.force-include]
"AGENTS.base.md" = "standards/files/AGENTS.base.md"
"docs/agent/rules" = "standards/files/docs/agent/rules"
".github/pull_request_template.md" = "standards/files/.github/pull_request_template.md"
".github/ISSUE_TEMPLATE/work-item.md" = "standards/files/.github/ISSUE_TEMPLATE/work-item.md"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C90", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Test data, not program values (code.md, Names over literals).
"tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
mypy_path = ["src", "tests"]
packages = ["standards"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
