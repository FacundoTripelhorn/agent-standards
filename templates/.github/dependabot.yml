# Dependency upgrades: weekly, minor and patch grouped into one PR per
# ecosystem. Keep the blocks for what the repository uses and delete the
# rest. Rules: docs/agent/rules/dependencies.md.
version: 2
updates:
  # Always: GitHub Actions (updates the pinned SHA and its version comment).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # package_manager: uv
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  # package_manager: pnpm or npm (both use the "npm" ecosystem)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  # Only with a Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
