# CI for every repository: the same jobs, each running a just recipe, so
# local and CI results match and every ruleset requires the same checks.
# Rules: docs/agent/rules/ci.md. Replace the "Toolchain" steps with the
# block for this repository's package_manager (below) and delete the rest.
# Both FacundoTripelhorn/agent-standards pins (the standards job and
# setup-just) use the same commit; Dependabot updates them together.
name: CI

on:
  pull_request:
  push:
    branches: [main]  # or master: the repository's default branch
    tags: ["v*"]  # release tags: the standards job checks them against version_file
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  standards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the checks compare against the base commit
      # Pin to the agent-standards commit this repository adopted.
      - uses: FacundoTripelhorn/agent-standards@<commit sha>  # v<version>
        with:
          mode: warn  # fail, once the warnings are understood

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: FacundoTripelhorn/agent-standards/setup-just@<commit sha>  # v<version>
      # Toolchain
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: just check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: FacundoTripelhorn/agent-standards/setup-just@<commit sha>  # v<version>
      # Toolchain
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: just test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: FacundoTripelhorn/agent-standards/setup-just@<commit sha>  # v<version>
      # Toolchain
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: just build

